[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibesound"
version = "0.1.0"
description = "Conversational piano audio editing: an MCP server that lets Claude see, analyze and repair WAV recordings."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "mcp>=1.2",
  "numpy>=1.26",
  "scipy>=1.11",
  "soundfile>=0.12",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vibesound-mcp = "vibesound.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
